# Plain HTTP: only the public display and its read-only data may use this. Every other device
# (phones running Kasse/Aufladung/Ops/NFC) is sent to the onboarding page and must switch to HTTPS.
server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

  include /etc/nginx/includes/locations-http.conf;
}

# TLS on a local-only certificate (mkcert), purely so phones can use Web NFC in a
# plain browser instead of the native Android app shell — Web NFC requires a secure
# context. Install deploy/certs/boersenparty-root-ca.pem on each phone that needs it.
server {
  listen 8443 ssl;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

  include /etc/nginx/includes/locations.conf;
}
