# Restricted set for plain HTTP (port 80): only what Smart-TV displays need, plus a path to
# bootstrap HTTPS trust on a new phone. Everything else is blocked here and must use HTTPS.

location = /network-check {
  default_type application/json;
  return 200 '{"proxy":"ok"}';
}

location = /ca.pem {
  alias /etc/nginx/certs/boersenparty-root-ca.pem;
  # Deliberately a generic type, not application/x-x509-ca-cert: that MIME type makes some
  # Chrome/Android builds intercept it as a direct certificate install or hold it for extra
  # scanning, which can get stuck as an unconfirmed .crdownload. An empty types{} is required
  # here because nginx's bundled mime.types already maps .pem and would otherwise win over
  # default_type.
  types { }
  default_type application/octet-stream;
  add_header Content-Disposition "attachment; filename=boersenparty-root-ca.pem" always;
}

location = /install-certificate.html { try_files $uri =404; }
location = /install-certificate.css { try_files $uri =404; }
location = /install-certificate.js { try_files $uri =404; }

location /assets/ {
  try_files $uri =404;
  expires 1y;
  add_header Cache-Control "public, immutable";
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}

# The public display (Smart TV): the only full page allowed over plain HTTP.
location = /market {
  try_files /index.html =404;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}

# The three read-only, unauthenticated endpoints the display polls.
location = /api/v1/products { proxy_pass http://api:3000; include /etc/nginx/includes/api-proxy.conf; }
location = /api/v1/market/history { proxy_pass http://api:3000; include /etc/nginx/includes/api-proxy.conf; }
location = /api/v1/operations/health { proxy_pass http://api:3000; include /etc/nginx/includes/api-proxy.conf; }

# Every other API call (login, purchases, top-ups, admin...) requires HTTPS.
location /api/ {
  default_type application/json;
  return 403 '{"code":"HTTPS_REQUIRED","message":"Dieses Gerät braucht HTTPS. Bitte zuerst /install-certificate.html öffnen."}';
}

# Everything else (the terminal app, nfc-test.html, ...) sends phones to the onboarding page.
location / {
  return 302 /install-certificate.html;
}
